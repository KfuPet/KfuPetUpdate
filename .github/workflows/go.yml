# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    # 本项目只面向 Windows：shortcut_windows.go、internal/winapi/*_windows.go、
    # internal/winreg/registry_windows.go 等平台实现都靠这个 job 覆盖编译。
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # 直接跟随 go.mod 中的版本，避免 CI 与本地版本不一致
        go-version-file: go.mod
        cache: true

    # Fyne 桌面程序依赖 CGO 编译，需要 gcc
    - name: Install MSYS2 toolchain
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc

    # 把 gcc 放进 PATH，让后续用 PowerShell 执行的 go 命令能找到 C 编译器
    - name: Add MinGW64 to PATH
      run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
